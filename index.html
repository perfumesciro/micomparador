<!DOCTYPE html>
<html>
<head>
  <title>Comparador de Precios</title>
  <style>
    body { font-family: Arial; text-align: center; }
    .card { border: 1px solid #ccc; margin: 10px; padding: 10px; display: inline-block; }
    .best { background-color: lightgreen; }
  </style>
</head>
<body>

<h1>Comparador de Precios</h1>

<button onclick="cargar()">Actualizar</button>

<div id="app"></div>

<script>
async function cargar() {
  const res = await fetch('data.json');
  const data = await res.json();

  const productos = data.pescado;
  const menor = Math.min(...productos.map(p => p.precio));

  let html = '';

  productos.forEach(p => {
    html += `
      <div class="card ${p.precio === menor ? 'best' : ''}">
        <h3>${p.super}</h3>
        <p>$${p.precio}</p>
      </div>
    `;
  });

  document.getElementById('app').innerHTML = html;
}
</script>

</body>
</html>
