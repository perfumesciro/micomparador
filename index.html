<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Football</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= MENÚ ================= -->

<section id="menu" class="screen active">

    <div class="menu-card">

        <div class="logo">ULTIMATE<br><span>FOOTBALL</span></div>

        <p>Penales • Tiros libres • Desafíos</p>

        <button class="main-btn" id="playPenalty">
            ⚽ PENAL
        </button>

        <button class="main-btn" id="playFreeKick">
            🎯 TIRO LIBRE
        </button>

        <button class="secondary-btn" id="tutorialBtn">
            📖 TUTORIAL
        </button>

    </div>

</section>


<!-- ================= TUTORIAL ================= -->

<section id="tutorial" class="screen">

    <div class="tutorial-card">

        <h1>📖 TUTORIAL</h1>

        <div id="tutorialContent"></div>

        <div class="tutorial-buttons">

            <button class="secondary-btn" id="tutorialBack">
                VOLVER
            </button>

            <button class="main-btn" id="tutorialNext">
                SIGUIENTE
            </button>

        </div>

    </div>

</section>


<!-- ================= JUEGO ================= -->

<section id="game">

    <div id="stadium">

        <div class="stands"></div>

        <div class="lights"></div>

        <div id="field">

            <div class="penalty-area"></div>

            <div class="goal-area"></div>

            <div id="goal">
                <div id="net"></div>
            </div>

            <div id="wall"></div>

            <div id="keeper">

                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>

            </div>

            <div id="player">

                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>

            </div>

            <div id="ball"></div>

            <div id="aim"></div>

        </div>

    </div>


    <!-- HUD -->

    <header id="hud">

        <div class="hud-box">
            <small>JUGADOR</small>
            <strong id="score">0</strong>
        </div>

        <div class="hud-center">

            <strong id="gameMode">PENALES</strong>

            <span id="roundText">
                TIRO 1 / 5
            </span>

        </div>

        <div class="hud-box">
            <small>DIFICULTAD</small>
            <strong id="difficulty">
                NORMAL
            </strong>
        </div>

    </header>


    <!-- MENSAJE -->

    <div id="gameMessage"></div>


    <!-- POTENCIA -->

    <div id="powerUI">

        <span>POTENCIA</span>

        <div class="power-bar">
            <div id="power"></div>
        </div>

    </div>


    <!-- EFECTO -->

    <div id="curveUI">

        <span>EFECTO</span>

        <input
            type="range"
            id="curve"
            min="-100"
            max="100"
            value="0"
        >

        <div>
            ← IZQUIERDA
            <b>CENTRO</b>
            DERECHA →
        </div>

    </div>


    <!-- CONTROLES -->

    <div id="controls">

        <button id="shootBtn">
            ⚡ PATEAR
        </button>

        <button id="resetBtn">
            🔄 REPETIR
        </button>

        <button id="menuBtn">
            🏠 MENÚ
        </button>

    </div>


    <!-- INDICADOR DE APUNTADO -->

    <div id="aimInfo">
        🖱️ Mové el mouse para apuntar
    </div>


    <!-- RESULTADO -->

    <div id="resultPanel">

        <div class="result-card">

            <h1 id="resultTitle">
                FINAL
            </h1>

            <p id="resultText"></p>

            <button class="main-btn" id="againBtn">
                JUGAR DE NUEVO
            </button>

            <button class="secondary-btn" id="resultMenuBtn">
                MENÚ PRINCIPAL
            </button>

        </div>

    </div>

</section>

<script src="game.js"></script>

<script src="part1.js"></script>
<script src="part2.js"></script>
<script src="part3.js"></script>
<script src="part4.js"></script>
<script src="part5.js"></script>
<script src="part6.js"></script>
<script src="part7.js"></script>
<script src="part8.js"></script>
<script src="part9.js"></script>
<script src="part10.js"></script>
<script src="part11.js"></script>
<script src="part12.js"></script>
<script src="part13.js"></script>
<script src="part14.js"></script>
<script src="part15.js"></script>
<script src="part16.js"></script>
<script src="part17.js"></script>
<script src="part18.js"></script>
<script src="part19.js"></script>
<script src="part20.js"></script>
<script src="part21.js"></script>
<script src="part22.js"></script>
<script src="part23.js"></script>
<script src="part24.js"></script>
<script src="part25.js"></script>
<script src="part26.js"></script>
<script src="part27.js"></script>

</body>
</html>
