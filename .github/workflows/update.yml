name: Actualizar precios automáticamente

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6 horas
  workflow_dispatch:  # te deja ejecutarlo manual

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Mostrar mensaje
        run: echo "Actualizando precios..."

      # 🔴 AQUÍ después vamos a poner el scraping o API

      - name: Guardar cambios
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "actualización automática de precios" || echo "sin cambios"
          git push
